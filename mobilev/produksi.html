<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Produksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/gauge.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <!-- Google Maps API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB861q02tPb43SuX8bSUB_mGJgo1KJ-YjE&callback=initMap&loading=async"></script>
</head>

<body class="bg-light">

    <div class="container my-4">
        <div class="card-body">
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link active" id="tma-tab" data-bs-toggle="tab" href="#tma" role="tab"
                        aria-controls="tma" aria-selected="true">Level Air</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="pressure-tab" data-bs-toggle="tab" href="#pressure" role="tab"
                        aria-controls="pressure" aria-selected="false">Tekanan</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="quality-tab" data-bs-toggle="tab" href="#quality" role="tab"
                        aria-controls="quality" aria-selected="false">Kualitas Air</a>
                </li>
            </ul>
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="tma" role="tabpanel" aria-labelledby="tma-tab">
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="waduk" class="form-label">Pilih Sumber Air:</label>
                            <select id="waduk" class="form-select" onchange="fetchData(); initMap();">
                                <option value="Sei Pulai">Waduk Sei Pulai</option>
                                <option value="Sei Gesek">Waduk Sei Gesek</option>
                                <option value="Kolong Enam">Waduk Kolong Enam</option>
                                <option value="Sei Jago">Waduk Sei Jago</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div id="waterLevelChart" style="width: 100%; height: 300px;"></div>
                        </div>
                    </div>
                    <!-- Google Map Container -->
                    <div class="row mt-3">
                        <div class="col-12">
                            <div id="map" style="width: 100%; height: 600px;"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="pressure" role="tabpanel" aria-labelledby="pressure-tab">
                    <!-- Pressure Tab Content -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="sensor" class="form-label">Pilih Sensor:</label>
                            <select id="sensor" class="form-select" onchange="fetchPressureData()">
                                <option value="sensor_gesek">IPA GESEK</option>
                                <option value="sensor_hdpe">IPA HDPE</option>
                                <option value="sensor_pcm">IPA PCM</option>
                                <option value="sensor_wk">IPA WK</option>
                                <option value="sensor_mobile">Sensor Mobile</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-12">
                            <div id="pressureGauge" style="width: 100%; height: 300px;"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div id="pressureLineChart" style="width: 100%; height: 300px;"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="quality" role="tabpanel" aria-labelledby="quality-tab">
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="date" class="form-label">Pilih Tanggal:</label>
                            <input type="date" id="date" class="form-control" onchange="fetchQualityData()">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <h5>Data Kualitas Air</h5>
                            <div id="qualityData">
                                <!-- Data will be dynamically populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            // Initial fetch of data for TMA and Map
            fetchData();
            initMap();
        });

        function fetchData() {
            let waduk = document.getElementById('waduk').value;

            $.ajax({
                url: 'fetch-tma.php',
                type: 'GET',
                data: { waduk: waduk },
                success: function (response) {
                    console.log('Raw response:', response); // Log the raw response

                    let data = JSON.parse(response);
                    console.log('Parsed data:', data); // Log the parsed data

                    // Format dates to dd/mm/yyyy
                    let formattedDates = data.dates.map(dateStr => {
                        let date = new Date(dateStr);
                        let day = String(date.getDate()).padStart(2, '0');
                        let month = String(date.getMonth() + 1).padStart(2, '0');
                        let year = date.getFullYear();
                        return `${day}/${month}/${year}`;
                    });

                    // Line Chart for Water Levels
                    Highcharts.chart('waterLevelChart', {
                        chart: {
                            type: 'line'
                        },
                        title: {
                            text: 'Tinggi Muka Air'
                        },
                        xAxis: {
                            categories: formattedDates // Use formatted dates
                        },
                        yAxis: {
                            title: {
                                text: ''
                            }
                        },
                        series: [{
                            name: 'TMA (m)',
                            data: data.levels,
                            color: '#007bff'
                        }]
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching data:', status, error);
                }
            });
        }

        function initMap() {
            let waduk = document.getElementById('waduk').value;

            // Coordinates for the different waduks
            const locations = {
                "Sei Pulai": { lat: 0.913534, lng: 104.548776 },
                "Sei Gesek": { lat: 0.976173, lng: 104.558228 },
                "Kolong Enam": { lat: 0.848370, lng: 104.591623 },
                "Sei Jago": { lat: 1.079725, lng: 104.252480 }
            };

            // Set map options
            let mapOptions = {
                zoom: 15,
                center: locations[waduk],
                mapTypeId: 'satellite',
                disableDefaultUI: true,
                styles: [
                    {
                        featureType: 'all',
                        elementType: 'labels',
                        stylers: [{ visibility: 'off' }]
                    }
                ]
            };

            // Create the map
            let map = new google.maps.Map(document.getElementById('map'), mapOptions);

            // Create a marker
            let marker = new google.maps.Marker({
                position: locations[waduk],
                map: map,
                title: waduk
            });
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            // Initial fetch of data for TMA and Map
            fetchPressureData();
        });

        function fetchPressureData() {
            let sensor = document.getElementById('sensor').value;

            $.ajax({
                url: 'fetch-pressure.php',
                type: 'GET',
                data: { sensor: sensor },
                success: function (response) {
                    console.log('Raw response:', response); // Log the raw response

                    // Check if response is already an object
                    if (typeof response === 'string') {
                        try {
                            response = JSON.parse(response);
                        } catch (e) {
                            console.error('Error parsing JSON:', e);
                            return;
                        }
                    }

                    console.log('Parsed data:', response); // Log the parsed data

                    // Format dates to dd/mm/yyyy
                    let formattedDates = response.time.map(dateStr => {
                        let date = new Date(dateStr);
                        let hours = String(date.getHours()).padStart(2, '0');
                        let minutes = String(date.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    });

                    // Convert pressure limits to numbers
                    let pressureLimits = response.pressureLimits.map(val => parseFloat(val));

                    // Log formatted data for debugging
                    console.log('Formatted dates:', formattedDates);
                    console.log('Pressure limits:', pressureLimits);

                    // Gauge for Pressure
                    Highcharts.chart('pressureGauge', {
                        chart: {
                            type: 'gauge'
                        },
                        title: {
                            text: 'Pressure Gauge'
                        },
                        pane: {
                            startAngle: -150,
                            endAngle: 150,
                            background: [{
                                // Background options
                            }]
                        },
                        yAxis: {
                            min: 0,
                            max: 12, // Adjust this based on your data range
                            title: {
                                text: 'Tekanan'
                            },
                            labels: {
                                formatter: function () {
                                    return this.value + ' bar';
                                }
                            }
                        },
                        series: [{
                            name: 'Pressure',
                            data: [response.currentPressure], // Assuming currentPressure is returned from the server
                            tooltip: {
                                valueSuffix: ' bar'
                            }
                        }]
                    });

                    // Line Chart for Pressure Limits
                    Highcharts.chart('pressureLineChart', {
                        chart: {
                            type: 'line'
                        },
                        title: {
                            text: 'Grafik Tekanan Hari Ini'
                        },
                        xAxis: {
                            categories: formattedDates // Use formatted dates
                        },
                        yAxis: {
                            title: {
                                text: ''
                            }
                        },
                        series: [{
                            name: 'Tekanan (bar)',
                            data: pressureLimits, // Use numeric values for pressure limits
                            color: '#ff5733'
                        }]
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching data:', status, error);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            // Set default date to today
            let today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;

            // Fetch quality data for the default date
            fetchQualityData();
        });

        function fetchQualityData() {
            let date = document.getElementById('date').value;

            $.ajax({
                url: 'fetch-quality.php',
                type: 'GET',
                data: { date: date },
                success: function (response) {
                    let data = JSON.parse(response);

                    // Clear the quality data container
                    $('#qualityData').empty();

                    // Populate the data in a horizontal layout
                    data.forEach(item => {
                        $('#qualityData').append(`
                    <div class="row mb-2">
                        <div class="col-md-2"><strong>Lokasi : ${item.lokasi}</strong></div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-2"><strong>Warna : </strong>${item.warna} Pt/Co</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-2"><strong>Kekeruhan : </strong>${item.kekeruhan} NTU</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-2"><strong>TDS : </strong>${item.tds} mg/L</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-2"><strong>pH : </strong>${item.ph}</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-2"><strong>Sisa Clorine : </strong>${item.scl} mg/L</div>
                    </div>
                    <hr>
                `);
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching quality data:', status, error);
                }
            });
        }
    </script>
</body>

</html>
