                          <!--/.request data -->
                          <script type="text/javascript">
                              var chart;
                      
                              function requestData() {
                                  $.ajax({
                                      url: 'data.php',
                                      dataType: 'json',
                                      success: function(data) {
                                          $.each(data, function(i, item) {
                                              var x = item.x,
                                                  y = item.y;
                                              var series = chart.series[0];
                                              series.addPoint([x, y], true, true);
                                          });
                                          setTimeout(requestData, 60000); //1000=1dtk 60000=1mnt  3600000=1jam
                                      },
                                      cache: false
                                  });
                              }
                          </script>
                      
                          <!--/.linechart -->
                          <script type="text/javascript">
                              $(document).ready(function() {
                                  chart = new Highcharts.Chart({
                                      chart: {
                                          marginLeft: 55,
                                          renderTo: 'linechart',
                                          defaultSeriesType: 'spline',
                                          events: {
                                              load: requestData
                                          }
                                      },
                                      title: {
                                          text: 'Grafik xx /menit'
                                      },
                                      xAxis: {
                                          type: 'datetime',
                                          tickPixelInterval: 150,
                                          maxZoom: 20 * 10000
                      
                                      },
                                      yAxis: {
                                          minPadding: 0.2,
                                          maxPadding: 0.2,
                                          // tickInterval: 14,
                                          title: {
                                              text: 'Pressure',
                                              margin: 7
                                          }
                                      },
                                      series: [{
                                          name: 'Sensor',
                                          data: (function() {
                                              var data = [];
                                              var json = (function() {
                                                  var json = null;
                                                  $.ajax({
                                                      'async': false,
                                                      'global': false,
                                                      url: 'data.php',
                                                      'dataType': "text",
                                                      'success': function(data) {
                                                          json = data;
                                                      }
                                                  });
                                                  return json;
                                              })();
                                              output = eval('(' + json + ')');
                                              //output = json;
                                              $.each(output, function(i, item) {
                                                  data.push({
                                                      x: output[i].x,
                                                      y: output[i].y
                                                  });
                                              })
                                              return data;
                                          }())
                                      }]
                                  });
                              });
                          </script>
