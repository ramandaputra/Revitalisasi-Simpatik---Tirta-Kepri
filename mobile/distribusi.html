<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Distribusi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/gauge.js"></script>
    <script src="https://code.highcharts.com/modules/solid-gauge.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/solid-gauge.src.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style type="text/css">
    #mapid {
        height: 80vh;
        /* Set height to 80% of viewport height */
        width: 100%;
    }

    html,
    body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    /* Center dropdown with some spacing */
    .dropdown-container {
        margin: 20px 0;
    }
</style>

<body class="bg-light">

    <div class="container my-4">
        <div class="card-body">
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link active" id="pompa-tab" data-bs-toggle="tab" href="#pompa" role="tab"
                        aria-controls="pompa" aria-selected="true">Pompa Distribusi</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="flow-tab" data-bs-toggle="tab" href="#flow" role="tab" aria-controls="flow"
                        aria-selected="false">Flow</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="gis-tab" data-bs-toggle="tab" href="#gis" role="tab" aria-controls="gis"
                        aria-selected="false">Peta</a>
                </li>
            </ul>
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="pompa" role="tabpanel" aria-labelledby="pompa-tab">
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="wilayah" class="form-label">Pilih Wilayah:</label>
                            <select id="wilayah" class="form-select" onchange="fetchData();">
                                <option value="tnj">Tanjungpinang</option>
                                <option value="kjg">Kijang</option>
                                <option value="tub">Tanjung Uban</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div id="pumpStatus" class="row">
                                <!-- Pump status cards will be dynamically inserted here -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="flow" role="tabpanel" aria-labelledby="flow-tab">
                    <!-- Flow Tab Content -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <label for="sensor" class="form-label">Pilih Sensor:</label>
                            <select id="sensor" class="form-select" onchange="fetchFlowData()">
                                <option value="sensor_gesek">Distribusi GESEK</option>
                                <option value="sensor_hdpe">Distribusi HDPE</option>
                                <option value="sensor_pcm">Distribusi PCM</option>
                                <option value="sensor_wk">Distribusi WK</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-12">
                            <div id="flowGauge" style="width: 100%; height: 300px;"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div id="flowLineChart" style="width: 100%; height: 300px;"></div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="gis" role="tabpanel" aria-labelledby="gis-tab">
                    <!-- Gis Tab Content -->
                    <div class="container">
                        <div class="row">
                            <!-- Dropdown to select region -->
                            <div class="col-md-4 mx-auto dropdown-container">
                                <label for="wilayah" class="font-weight-bold">Pilih Wilayah:</label>
                                <select id="wilayah" class="form-control" onchange="changeMap()">
                                    <option value="tnj">Tanjungpinang</option>
                                    <option value="kjg">Kijang</option>
                                    <option value="tub">Tanjung Uban</option>
                                </select>
                            </div>
                        </div>

                        <!-- Map Container -->
                        <div class="row">
                            <div class="col-12">
                                <div id="mapid"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB861q02tPb43SuX8bSUB_mGJgo1KJ-YjE&callback=initMap&loading=async"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            fetchData();
        });

        function fetchData() {
            let wilayah = document.getElementById('wilayah').value;

            $.ajax({
                url: 'fetch-pump.php',
                type: 'GET',
                data: { wilayah: wilayah },
                success: function (response) {
                    console.log('Raw response:', response);

                    // If the response is a string, parse it, otherwise use it directly
                    let data;
                    if (typeof response === 'string') {
                        try {
                            data = JSON.parse(response);
                        } catch (e) {
                            console.error('Error parsing JSON:', e);
                            return;
                        }
                    } else {
                        data = response; // Already an object, no need to parse
                    }

                    // Clear the pump status container
                    $('#pumpStatus').empty();

                    // Populate the pump status data
                    data.forEach(pump => {
                        let statusClass = pump.status === 'Running' ? 'bg-success text-white' : 'bg-danger text-white';
                        $('#pumpStatus').append(`
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${pump.name}</h5>
                                <p class="card-text">Status: <span class="badge ${statusClass}">${pump.status}</span></p>
                                <p class="card-text">Last Updated: ${new Date(pump.time).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                `);
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching pump data:', status, error);
                    console.log('Response:', xhr.responseText); // Log the error response
                }
            });
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            fetchFlowData();
        });

        function fetchFlowData() {
            let sensor = document.getElementById('sensor').value;

            $.ajax({
                url: 'fetch-flow.php',
                type: 'GET',
                data: { sensor: sensor },
                success: function (response) {
                    console.log('Raw response:', response); // Log the raw response

                    // Check if response is already an object
                    if (typeof response === 'string') {
                        try {
                            response = JSON.parse(response);
                        } catch (e) {
                            console.error('Error parsing JSON:', e);
                            return;
                        }
                    }

                    console.log('Parsed data:', response); // Log the parsed data

                    // Format dates to dd/mm/yyyy
                    let formattedDates = response.time.map(dateStr => {
                        let date = new Date(dateStr);
                        let hours = String(date.getHours()).padStart(2, '0');
                        let minutes = String(date.getMinutes()).padStart(2, '0');
                        return `${hours}:${minutes}`;
                    });

                    // Convert pressure limits to numbers
                    let flowLimits = response.flowLimits.map(val => parseFloat(val));

                    // Log formatted data for debugging
                    console.log('Formatted dates:', formattedDates);
                    console.log('Flow limits:', flowLimits);

                    // Gauge for Flow
                    Highcharts.chart('flowGauge', {
                        chart: {
                            type: 'solidgauge' // Change chart type to solidgauge
                        },
                        title: {
                            text: 'Flow Meter'
                        },
                        pane: {
                            center: ['50%', '50%'], // Center the gauge
                            size: '100%', // Adjust size to fit the container
                            startAngle: -90, // Adjust start angle
                            endAngle: 90, // Adjust end angle
                            background: [{
                                backgroundColor: Highcharts.defaultOptions.legend.backgroundColor || '#EEE', // Default background color
                                borderWidth: 0,
                                outerRadius: '100%',
                                innerRadius: '100%',
                                shape: 'arc'
                            }]
                        },
                        yAxis: {
                            min: 0,
                            max: 400, // Adjust this based on your data range
                            title: {
                                text: 'Flow'
                            },
                            labels: {
                                enabled: false // Disable labels for solid gauge
                            }
                        },
                        series: [{
                            name: 'Flow',
                            data: [response.currentFlow], // Assuming currentFlow is returned from the server
                            dataLabels: {
                                y: -10,
                                borderWidth: 0,
                                useHTML: true,
                                formatter: function () {
                                    return `<div style="text-align:center;font-size:20px">${this.y} m³/jam</div>`;
                                }
                            },
                            tooltip: {
                                valueSuffix: ' m³/jam'
                            }
                        }]
                    });

                    // Line Chart for Flow Limits
                    Highcharts.chart('flowLineChart', {
                        chart: {
                            type: 'line'
                        },
                        title: {
                            text: 'Grafik Flow Hari Ini'
                        },
                        xAxis: {
                            categories: formattedDates // Use formatted dates
                        },
                        yAxis: {
                            title: {
                                text: ''
                            }
                        },
                        series: [{
                            name: 'Flow (m³/jam)',
                            data: flowLimits, // Use numeric values for flow limits
                            color: '#ff5733'
                        }]
                    });
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching data:', status, error);
                }
            });
        }
    </script>
    <script>
        var map;
        var mapOptions = {
            tnj: {
                center: {
                    lat: 0.916718,
                    lng: 104.484081
                },
                zoom: 12,
                mapTypeId: 'satellite'
            },
            kjg: {
                center: {
                    lat: 0.853712,
                    lng: 104.597167
                },
                zoom: 13,
                mapTypeId: 'satellite'
            },
            tub: {
                center: {
                    lat: 1.073478,
                    lng: 104.236227
                },
                zoom: 13,
                mapTypeId: 'satellite'
            }
        };

        function initMap() {
            map = new google.maps.Map(document.getElementById('mapid'), mapOptions['tnj']);
            loadGeoJSONData();
            loadMarkerData();
        }

        function changeMap() {
            var selectedRegion = document.getElementById('wilayah').value;
            map = new google.maps.Map(document.getElementById('mapid'), mapOptions[selectedRegion]);
            loadGeoJSONData();
            loadMarkerData();
        }

        function loadGeoJSONData() {
            $.getJSON("get_geojson.php", function (geojsonData) {
                var geojsonLayer = new google.maps.Data({
                    map: map
                });
                geojsonLayer.setStyle({
                    strokeColor: 'orange',
                    strokeWeight: 2,
                    strokeOpacity: 0.8
                });
                geojsonLayer.addGeoJson(geojsonData);
            });
        }

        function loadMarkerData() {
            $.getJSON("get_markers.php", function (markerData) {
                markerData.forEach(function (marker) {
                    var popupContent = `<b>${marker.name}</b><br>
                        <u>${marker.time}</u><br>
                        Pressure: ${marker.pressure} bar<br>
                        Flow: ${marker.flow} m³/h<br>
                        TDS: ${marker.tds} ppm<br>
                        Level: ${marker.level} m`;

                    var infowindow = new google.maps.InfoWindow({
                        content: popupContent
                    });

                    var circleRadius = calculateCircleRadius(marker.pressure);
                    var circleColor = marker.pressure >= 1 ? 'blue' : 'red';

                    var markerWithLabel = new google.maps.Marker({
                        position: new google.maps.LatLng(parseFloat(marker.latitude), parseFloat(marker.longitude)),
                        map: map,
                        label: {
                            text: marker.name,
                            fontSize: '12px'
                        },
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: circleRadius,
                            fillColor: circleColor,
                            fillOpacity: 0.6,
                            strokeWeight: 0
                        }
                    });

                    markerWithLabel.addListener('click', function () {
                        infowindow.open(map, markerWithLabel);
                    });
                });
            });
        }

        function calculateCircleRadius(pressure) {
            return Math.max(0, 12 - pressure);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
